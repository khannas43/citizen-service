server.port=8080
server.servlet.context-path=/scheme-engine-service

spring.datasource.url=jdbc:postgresql://postgres.citizen.svc.cluster.local:5432/citizen_db?currentSchema=scheme_engine
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=scheme_engine

spring.kafka.bootstrap-servers=kafka.citizen.svc.cluster.local:9092
spring.kafka.consumer.group-id=scheme-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

family.registry.base-url=http://family-registry-service.citizen.svc.cluster.local:8080/family-registry-service

# Cap families evaluated per simulation run (registry may contain 200k+ seed records)
simulation.max-families=500

spring.codec.max-in-memory-size=64MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

officer.jwks-uri=${OFFICER_JWKS_URI:http://keycloak.citizen.svc.cluster.local:8080/realms/citizen/protocol/openid-connect/certs}
officer.scheme-content.allowed-roles=SCHEME_DEPT,DEPT_ADMIN
