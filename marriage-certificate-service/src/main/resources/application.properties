server.port=8080
server.servlet.context-path=/marriage-certificate-service

spring.datasource.url=jdbc:postgresql://postgres.egov.svc.cluster.local:5432/egov_db?currentSchema=marriage_cert
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

egov.workflow.base-url=http://egov-workflow-v2.egov.svc.cluster.local:8080/egov-workflow-v2
egov.workflow.tenant-id=pg
egov.workflow.business-service=MARRIAGE_CERT
egov.workflow.module-name=marriage-certificate-service
egov.workflow.citizen-uuid=a1b2c3d4-e5f6-4789-a012-b3c4d5e6f7a8
egov.workflow.citizen-username=priya.patel
egov.workflow.citizen-name=Priya Patel
egov.workflow.officer-uuid=officer-demo-001
egov.workflow.officer-name=Demo Officer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
