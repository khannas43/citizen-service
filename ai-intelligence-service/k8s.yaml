apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-intelligence-service
  namespace: citizen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-intelligence-service
  template:
    metadata:
      labels:
        app: ai-intelligence-service
    spec:
      containers:
      - name: ai-intelligence-service
        image: cs-ai-intelligence-service:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 8089
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            # Whisper medium (Gujarati) needs ~2 GB on top of the ~1 GB service; 4 CPUs keep a transcription near 10 s
            memory: "6Gi"
            cpu: "4000m"
        env:
        - name: DATABASE_URL
          value: "postgresql://citizenuser:egovpass@postgres.citizen.svc.cluster.local:5432/citizen_db"
        - name: OLLAMA_BASE_URL
          value: "http://host.docker.internal:11434"
        - name: OLLAMA_MODEL
          value: "gemma3:4b"
        - name: SEARCH_LLM_RERANK
          value: "false"
        - name: SEARCH_LLM_TIMEOUT_SEC
          value: "3"
        - name: RECOMMEND_USE_LLM
          value: "false"
        - name: WHISPER_MODEL
          value: "base"
        - name: WHISPER_MODEL_GU
          value: "medium"
        - name: WHISPER_BEAM_SIZE
          value: "5"
        - name: STT_REMOTE_URL
          value: "http://host.docker.internal:8091"
        - name: STT_REMOTE_TOKEN
          valueFrom:
            secretKeyRef:
              name: stt-worker
              key: token
              optional: true
        - name: SUPERSET_INTERNAL_URL
          value: "http://superset.citizen.svc.cluster.local:8088"
        - name: SUPERSET_ADMIN_USER
          value: "admin"
        - name: SUPERSET_ADMIN_PASS
          value: "admin123"
        - name: PORT
          value: "8089"
        livenessProbe:
          httpGet:
            path: /health
            port: 8089
          initialDelaySeconds: 180
          periodSeconds: 20
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 8089
          initialDelaySeconds: 150
          periodSeconds: 15
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ai-intelligence-service
  namespace: citizen
spec:
  selector:
    app: ai-intelligence-service
  type: NodePort
  ports:
  - port: 8089
    targetPort: 8089
    nodePort: 31189
