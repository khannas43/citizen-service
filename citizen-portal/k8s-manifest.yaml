apiVersion: apps/v1
kind: Deployment
metadata:
  name: citizen-portal
  namespace: citizen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citizen-portal
  template:
    metadata:
      labels:
        app: citizen-portal
    spec:
      containers:
      - name: citizen-portal
        image: cs-citizen-portal:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: citizen-portal
  namespace: citizen
spec:
  selector:
    app: citizen-portal
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31174
