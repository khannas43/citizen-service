server {
    # Resolve upstreams at request time so a service that is not deployed does not stop nginx from starting.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location /assets/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /realms/ {
        set $upstream http://keycloak.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /auth-service/ {
        set $upstream http://auth-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /caste-certificate-service/ {
        set $upstream http://caste-certificate-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /marriage-certificate-service/ {
        set $upstream http://marriage-certificate-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /pension-service/ {
        set $upstream http://pension-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /family-member-service/ {
        set $upstream http://family-member-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /scheme-application-service/ {
        set $upstream http://scheme-application-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /family-registry-service/ {
        set $upstream http://family-registry-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /scheme-engine-service/v1/admin/ {
        return 403;
    }

    location /expenditure-integrity-service/v1/admin/ {
        return 403;
    }

    location /expenditure-integrity-service/ {
        set $upstream http://expenditure-integrity-service.citizen.svc.cluster.local:8092;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /scheme-engine-service/ {
        set $upstream http://scheme-engine-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /chatbot-service/ {
        set $upstream http://chatbot-service.citizen.svc.cluster.local:8088;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /grievance-service/ {
        set $upstream http://grievance-service.citizen.svc.cluster.local:8089;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /notifications-service/ {
        set $upstream http://notifications-service.citizen.svc.cluster.local:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /ai-intelligence-service/ {
        rewrite ^/ai-intelligence-service/(.*)$ /$1 break;
        set $upstream http://ai-intelligence-service.citizen.svc.cluster.local:8089;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 6m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # FB-E5.3A — runtime-substituted FDS location (see nginx/form-definition-service-location.conf.template).
    include /etc/nginx/form-definition-service/*.conf;
}
