server.port=8080
server.servlet.context-path=/notifications-service

spring.datasource.url=jdbc:postgresql://postgres.egov.svc.cluster.local:5432/egov_db?currentSchema=notifications
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=notifications
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
