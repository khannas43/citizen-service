apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-registry-service
  namespace: citizen
  labels:
    app: family-registry-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: family-registry-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: family-registry-service
    spec:
      containers:
        - name: family-registry-service
          image: cs-family-registry-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          startupProbe:
            httpGet:
              path: /family-registry-service/actuator/health/liveness
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /family-registry-service/actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /family-registry-service/actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: family-registry-service
  namespace: citizen
spec:
  selector:
    app: family-registry-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
