server.port=8080
server.servlet.context-path=/scheme-application-service

spring.datasource.url=jdbc:postgresql://postgres.citizen.svc.cluster.local:5432/citizen_db?currentSchema=scheme_application
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

flowable.database-schema-update=true
flowable.async-executor-activate=true
flowable.app.enabled=false
flowable.cmmn.enabled=false
flowable.dmn.enabled=false
flowable.eventregistry.enabled=false
flowable.idm.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

family.registry.base-url=http://family-registry-service.citizen.svc.cluster.local:8080/family-registry-service
scheme.engine.base-url=http://scheme-engine-service.citizen.svc.cluster.local:8080/scheme-engine-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
