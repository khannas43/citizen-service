apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheme-application-service
  namespace: egov
  labels:
    app: scheme-application-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheme-application-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: scheme-application-service
    spec:
      containers:
        - name: scheme-application-service
          image: scheme-application-service:arm64-local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-service-key
                  key: key
                  optional: true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          startupProbe:
            httpGet:
              path: /scheme-application-service/actuator/health/liveness
              port: 8080
            failureThreshold: 80
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /scheme-application-service/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /scheme-application-service/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 8
          resources:
            requests:
              memory: "640Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: scheme-application-service
  namespace: egov
spec:
  selector:
    app: scheme-application-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
