apiVersion: apps/v1
kind: Deployment
metadata:
  name: officer-portal
  namespace: citizen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: officer-portal
  template:
    metadata:
      labels:
        app: officer-portal
    spec:
      containers:
      - name: officer-portal
        image: cs-officer-portal:dev
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: officer-portal
  namespace: citizen
spec:
  selector:
    app: officer-portal
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31173
