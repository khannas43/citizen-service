server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA shell — stale hashes break the app after redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /realms/ {
        proxy_pass http://keycloak.egov.svc.cluster.local:8080/realms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /caste-certificate-service/ {
        proxy_pass http://caste-certificate-service.egov.svc.cluster.local:8080/caste-certificate-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /marriage-certificate-service/ {
        proxy_pass http://marriage-certificate-service.egov.svc.cluster.local:8080/marriage-certificate-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /pension-service/ {
        proxy_pass http://pension-service.egov.svc.cluster.local:8080/pension-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /family-member-service/ {
        proxy_pass http://family-member-service.egov.svc.cluster.local:8080/family-member-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /scheme-application-service/ {
        proxy_pass http://scheme-application-service.egov.svc.cluster.local:8080/scheme-application-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /family-registry-service/ {
        proxy_pass http://family-registry-service.egov.svc.cluster.local:8080/family-registry-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /expenditure-integrity-service/ {
        proxy_pass http://expenditure-integrity-service.egov.svc.cluster.local:8092/expenditure-integrity-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /scheme-engine-service/ {
        proxy_pass http://scheme-engine-service.egov.svc.cluster.local:8080/scheme-engine-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /grievance-service/ {
        proxy_pass http://grievance-service.egov.svc.cluster.local:8089/grievance-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /notifications-service/ {
        proxy_pass http://notifications-service.egov.svc.cluster.local:8080/notifications-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /chatbot-service/ {
        proxy_pass http://chatbot-service.egov.svc.cluster.local:8088/chatbot-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ai-intelligence-service/ {
        proxy_pass http://ai-intelligence-service.egov.svc.cluster.local:8089/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # FB-E5.3A — runtime-substituted FDS location (see nginx/form-definition-service-location.conf.template).
    include /etc/nginx/form-definition-service/*.conf;
}
