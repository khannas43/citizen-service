server.port=8092
server.servlet.context-path=/expenditure-integrity-service

spring.datasource.url=jdbc:postgresql://postgres.citizen.svc.cluster.local:5432/citizen_db?currentSchema=expenditure_integrity
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=expenditure_integrity

scheme.engine.base-url=http://scheme-engine-service.citizen.svc.cluster.local:8080/scheme-engine-service
family.registry.base-url=http://family-registry-service.citizen.svc.cluster.local:8080/family-registry-service

officer.jwks-uri=${OFFICER_JWKS_URI:http://keycloak.citizen.svc.cluster.local:8080/realms/citizen/protocol/openid-connect/certs}
# Endpoint-level rules (the union of the per-domain lists below, plus the operations roles)
officer.integrity.allowed-roles=SCHEME_DEPT,DEPT_ADMIN,REVENUE_OFFICER,IT_ADMIN,PAYROLL_REVIEWER,FINANCE_OFFICER,HR_OFFICER
officer.integrity.admin-roles=IT_ADMIN,DEPT_ADMIN
officer.integrity.review-roles=SCHEME_DEPT,DEPT_ADMIN,REVENUE_OFFICER,PAYROLL_REVIEWER
officer.integrity.action-roles=DEPT_ADMIN,FINANCE_OFFICER
officer.integrity.gate-roles=DEPT_ADMIN,FINANCE_OFFICER
officer.integrity.overview-roles=SCHEME_DEPT,DEPT_ADMIN,REVENUE_OFFICER,IT_ADMIN,FINANCE_OFFICER,SENIOR_MGMT
officer.integrity.fraud-roles=REVENUE_OFFICER,DEPT_ADMIN
# Per-domain rules. Payroll cases show individual salaries, so scheme officers and IT admins are not in them.
# PAYROLL_REVIEWER, FINANCE_OFFICER and HR_OFFICER work as soon as those roles exist in Keycloak.
officer.integrity.beneficiary-read-roles=SCHEME_DEPT,DEPT_ADMIN,REVENUE_OFFICER,IT_ADMIN,FINANCE_OFFICER
officer.integrity.beneficiary-review-roles=SCHEME_DEPT,DEPT_ADMIN,REVENUE_OFFICER
officer.integrity.payroll-read-roles=DEPT_ADMIN,PAYROLL_REVIEWER,FINANCE_OFFICER,HR_OFFICER
officer.integrity.payroll-review-roles=DEPT_ADMIN,PAYROLL_REVIEWER
# Recoveries at or above this amount (rupees) need a second approver; verification second-person check is off for the single demo admin.
officer.integrity.recovery-approval-threshold=100000
officer.integrity.verify-needs-second-person=false
# Pilot share of state beneficiary spend (percent). 0 = projection hidden. Example: 5 means the pilot is 5% of the state.
officer.integrity.projection.pilot-share-percent=0
officer.integrity.notice-response-days=15
officer.integrity.priority.no-amount-weight=5000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

integrity.pilot.grace-days-after-death=30
integrity.rule804.bank-token-min-units=4
integrity.rule805.operator-change-threshold=5
integrity.rule805.batch-approval-prefix=BATCH-
integrity.s06.bank-change-window-days=90
integrity.s06.life-certificate-max-age-days=365

# CSV imports of a pilot year can be several MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
