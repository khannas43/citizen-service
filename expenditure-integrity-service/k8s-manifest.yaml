apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenditure-integrity-service
  namespace: egov
  labels:
    app: expenditure-integrity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expenditure-integrity-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: expenditure-integrity-service
    spec:
      containers:
        - name: expenditure-integrity-service
          image: expenditure-integrity-service:arm64-local
          imagePullPolicy: Never
          ports:
            - containerPort: 8092
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-service-key
                  key: key
                  optional: true
            - name: OFFICER_JWKS_URI
              value: "http://keycloak.egov.svc.cluster.local:8080/realms/egov/protocol/openid-connect/certs"
          startupProbe:
            httpGet:
              path: /expenditure-integrity-service/actuator/health/liveness
              port: 8092
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /expenditure-integrity-service/actuator/health/liveness
              port: 8092
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /expenditure-integrity-service/actuator/health/readiness
              port: 8092
            periodSeconds: 10
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "1024Mi"
              cpu: "800m"
---
apiVersion: v1
kind: Service
metadata:
  name: expenditure-integrity-service
  namespace: egov
spec:
  selector:
    app: expenditure-integrity-service
  ports:
    - name: http
      port: 8092
      targetPort: 8092
