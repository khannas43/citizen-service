server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /form-definition-service

spring:
  application:
    name: form-definition-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/egov_db}
    username: ${SPRING_DATASOURCE_USERNAME:egov}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: form_definition
  flyway:
    enabled: true
    schemas: form_definition
    default-schema: form_definition
    create-schemas: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
