apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-portal
  namespace: egov
spec:
  replicas: 1
  selector:
    matchLabels:
      app: family-portal
  template:
    metadata:
      labels:
        app: family-portal
    spec:
      containers:
      - name: family-portal
        image: family-portal:arm64-local
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: family-portal
  namespace: egov
spec:
  selector:
    app: family-portal
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30075
