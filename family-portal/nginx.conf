server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /family-registry-service/ {
        proxy_pass http://family-registry-service.citizen.svc.cluster.local:8080/family-registry-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /scheme-engine-service/ {
        proxy_pass http://scheme-engine-service.citizen.svc.cluster.local:8080/scheme-engine-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
