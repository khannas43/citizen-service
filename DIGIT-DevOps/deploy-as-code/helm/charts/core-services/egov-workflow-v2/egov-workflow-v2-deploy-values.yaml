labels:
  app: "egov-workflow-v2"
  group: "rainmaker"
initContainers:
  dbMigration:
    enabled: false
ingress:
  enabled: false
image:
  repository: "egov-workflow-v2"
  tag: "arm64-local"
  pullPolicy: Never
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/egov-workflow-v2/health/liveness"
  readinessProbePath: "/egov-workflow-v2/health/readiness"
env: |
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: egov-tl-services
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.springframework.kafka.support.serializer.JsonSerializer
  - name: PERSISTER_SAVE_WF_TOPIC
    value: save-wf-transitions
  - name: EGOV_MDMS_HOST
    value: "http://egov-mdms-service.egov.svc.cluster.local:8080"
  - name: STATE_LEVEL_TENANT_ID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: state-level-tenant-id
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: "/egov-mdms-service/v1/_search"
  - name: EGOV_USER_HOST
    value: "http://egov-user.egov.svc.cluster.local:8080"
  - name: EGOV_USER_SEARCH_ENDPOINT
    value: "/user/v1/_search"
  - name: JAVA_OPTS
    value: "-Xmx192m -Xms192m"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "org.postgresql.Driver"
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_ENABLE_DEBUG
    value: "false"
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_WF_DEFAULT_LIMIT
    value: "100"
  - name: EGOV_WF_STATELEVEL
    value: "true"
