# FB-E5.2 — Form Definition Service chart values (provisional / non-production).
# No secret values. No production sizing. No governance-technical profile.

global:
  # Provisional local/render placeholder — not a production registry decision.
  containerRegistry: egovio
  domain: localhost

labels:
  app: form-definition-service
  group: core

namespace: egov
name: form-definition-service

replicas: 1
httpPort: 8080

image:
  # Provisional repository/tag for helm template/lint only — not an approved digest.
  repository: form-definition-service
  tag: e5.2-render-only
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: pullsecret

terminationGracePeriodSeconds: 30

# Documented soft drain before SIGTERM handling (common-chart convention).
lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - sleep 10

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 512Mi

# Optional JVM options from the host/platform. Empty by default — do not invent
# production heap sizing here. Prefer JAVA_TOOL_OPTIONS over profile flags.
javaToolOptions: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

healthChecks:
  livenessPath: /form-definition-service/actuator/health/liveness
  readinessPath: /form-definition-service/actuator/health/readiness
  startupPath: /form-definition-service/actuator/health
  liveness:
    initialDelaySeconds: 40
    periodSeconds: 15
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  startup:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 36

# Existing platform ConfigMap / Secret references only — chart never creates Secrets.
db:
  url:
    configMapName: egov-config
    key: db-url
  username:
    secretName: db
    key: username
  password:
    secretName: db
    key: password
  # Optional separate Flyway credentials (disabled by default; app uses datasource).
  flyway:
    enabled: false
    username:
      secretName: db
      key: flyway-username
    password:
      secretName: db
      key: flyway-password

ingress:
  enabled: false
  zuul: false
  context: form-definition-service
  waf:
    enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
  # No rewrite-target / strip-prefix — path /form-definition-service must be preserved.

service:
  type: ClusterIP
  additionalAnnotations: ""

affinity:
  preferSpreadAcrossAZ: false
