apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdm-service
  namespace: citizen
  labels:
    app: mdm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdm-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mdm-service
    spec:
      containers:
        - name: mdm-service
          image: cs-mdm-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8100
          env:
            - name: DB_HOST
              value: postgres.citizen.svc.cluster.local
            - name: DB_NAME
              value: citizen_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
            - name: MDM_STATE_CODE
              value: "TG"
            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak.citizen.svc.cluster.local:8080/realms/citizen/protocol/openid-connect/certs"
            # Roles: reading needs any signed-in officer; changing links needs one of these realm roles.
            - name: MDM_READ_ROLES
              value: "*"
            - name: MDM_WRITE_ROLES
              value: "MDM_STEWARD,MDM_ADMIN,ADMIN"
            - name: MDM_ADMIN_ROLES
              value: "MDM_ADMIN,ADMIN"
          startupProbe:
            httpGet:
              path: /mdm-service/api/health
              port: 8100
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /mdm-service/api/health
              port: 8100
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /mdm-service/api/health
              port: 8100
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1280Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: mdm-service
  namespace: citizen
spec:
  selector:
    app: mdm-service
  ports:
    - name: http
      port: 8100
      targetPort: 8100
