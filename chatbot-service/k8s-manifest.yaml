apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: egov
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
      - name: chatbot-service
        image: chatbot-service:arm64-local
        imagePullPolicy: Never
        ports:
        - containerPort: 8088
        livenessProbe:
          httpGet:
            path: /chatbot-service/v1/chat/health
            port: 8088
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 4
        readinessProbe:
          httpGet:
            path: /chatbot-service/v1/chat/health
            port: 8088
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "384Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: egov
spec:
  selector:
    app: chatbot-service
  ports:
  - port: 8088
    targetPort: 8088
    nodePort: 30088
  type: NodePort
