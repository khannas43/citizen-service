global:
  domain: localhost

configmaps:
  egov-config:
    db-url: "jdbc:postgresql://postgres.citizen.svc.cluster.local:5432/citizen_db"
    kafka-brokers: "kafka.citizen.svc.cluster.local:9092"
    domain: "localhost"
    egov-services-fqdn-name: "http://localhost/"
    egov-state-level-tenant-id: "pg"
    state-level-tenant-id: "pg"
    mobile-validation-workaround: "true"
    serializers-timezone-in-ist: "true"
    timezone: "Asia/Kolkata"
    spring-jpa-show-sql: "true"
    logging-level-jdbc: "debug"
    spring-datasource-tomcat-initialSize: "1"
    spring-datasource-tomcat-max-active: "2"
    server-tomcat-max-threads: "10"
    tracer-errors-provideexceptionindetails: "true"

# Per-service overrides — db-url for services that need a non-default schema.
# egov-workflow-v2 uses a dedicated schema within the same citizen_db database.
egov-workflow-v2:
  db-url: "jdbc:postgresql://postgres.citizen.svc.cluster.local:5432/citizen_db?currentSchema=egov_common_workflows"
